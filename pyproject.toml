[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chrpypy"
version = "0.4"
description = "A Python implementation of CHR using chrpp as engine"
readme = "README.md"
requires-python = ">=3.14"
authors = [
  { name = "BARICHARD Vincent", email = "vincent.barichard@univ-angers.fr" },
  { name = "GENEST David", email = "david.genest@univ-angers.fr" },
  { name = "LEGEAY Marc", email = "marc.legeay@univ-angers.fr" },
  { name = "SIMON Aurélien", email = "aurelien.simon@univ-angers.fr" },
]
maintainers = [
  { name = "Aurélien SIMON", email = "aurelien.simon@univ-angers.fr" },
]
dependencies = [
  "pybind11==3.0.1",
  "ipython==9.9.0",
  "asttokens==3.0.1",
  "decorator==5.2.1",
  "executing==2.2.1",
  "graphviz==0.21",
  "greenlet==3.3.1",
  "iniconfig==2.3.0",
  "ipython-pygments-lexers==1.1.1",
  "jedi==0.19.2",
  "matplotlib-inline==0.2.1",
  "packaging==26.2",
  "parso==0.8.5",
  "pexpect==4.9.0",
  "pluggy==1.6.0",
  "prompt-toolkit==3.0.52",
  "ptyprocess==0.7.0",
  "pure-eval==0.2.3",
  "pygments==2.19.2",
  "pytest==9.1.1",
  "setuptools==80.10.1",
  "stack-data==0.6.3",
  "tqdm==4.70.0",
  "traitlets==5.14.3",
  "typing-extensions==4.15.0",
  "wcwidth==0.2.14",
  "lark>=1.3.1",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/owrel/chrpypy"
Repository = "https://github.com/owrel/chrpypy"

[tool.uv.workspace]
members = [".", ".", ".", "."]

[tool.uv.sources]
chrpypy = { workspace = true }

[dependency-groups]
dev = ["chrpypy"]
